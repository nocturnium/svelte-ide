<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#0d1421" />
		<meta name="color-scheme" content="dark" />
		<!-- Per-route <title>, description, canonical, Open Graph and Twitter tags are
		     emitted by the <Seo> component (src/routes/_components/Seo.svelte) so they
		     bake into each prerendered page. No static title/description here — a static
		     one renders before %sveltekit.head% and would win over the per-route title. -->
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
