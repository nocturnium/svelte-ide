# Secret-scanning guard.
#
# Runs TruffleHog on every push to main and every pull request (scans the new
# commits), and re-scans the entire git history weekly and on demand. The
# action invokes `trufflehog ... --fail`, so a verified secret fails the job and
# blocks the change.
#
# Third-party actions are pinned to a full commit SHA (the trailing `# vX.Y.Z`
# comment records the human-readable version the SHA corresponds to). Update the
# SHA and the comment together when bumping versions.
name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "37 5 * * 1" # weekly — Monday 05:37 UTC (full-history scan)
  workflow_dispatch:

# Least privilege: the scan only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  # Cancel superseded PR runs for fast feedback, but never cancel a push/
  # scheduled scan — that could leave a default-branch commit range unscanned.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  trufflehog:
    name: TruffleHog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # Full history so push/PR diffs resolve and scheduled runs scan everything.
          fetch-depth: 0

      - name: TruffleHog scan
        uses: trufflesecurity/trufflehog@d411fff7b8879a62509f3fa98c07f247ac089a51 # v3.95.5
        with:
          # Pin the scanner image too — the action otherwise runs the mutable
          # ghcr.io/trufflesecurity/trufflehog:latest. Keep this version in sync
          # with the action SHA above when bumping.
          version: "3.95.5"
          # push/PR: scan the referenced commits. schedule/workflow_dispatch:
          # scan the full history. The action adds `--fail`, so a verified
          # finding fails this job. To reduce false positives you can narrow this
          # to `--only-verified`; to also fail on unverified candidates keep
          # `unknown` below.
          extra_args: --results=verified,unknown
