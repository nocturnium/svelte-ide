# Build the demo app as a static site and deploy it to GitHub Pages.
#
# Requires GitHub Pages to be enabled for the repo (Settings → Pages → Source:
# "GitHub Actions"). Pages on a private repo needs GitHub Pro/Team/Enterprise;
# on a public repo it is free.
#
# Third-party actions are pinned to a full commit SHA (trailing `# vX.Y.Z`
# records the version). Bump the SHA and the comment together.
name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege + the scopes the Pages deployment needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one in-flight Pages deployment; don't cancel a running one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build (base path from Pages config)
        env:
          # configure-pages emits the correct base path for project pages
          # (e.g. /svelte-ide) or a custom domain (empty).
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
